name: Daily HoYoLAB Auto Login

on:
  schedule:
    - cron: '0 16 * * *'  # 日本時間1:00に実行（UTC 16:00）
  workflow_dispatch:  # 手動実行も可能

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v3

      - name: Python のセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 依存パッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: スクリプトを実行
        run: python src/hoyolab.py

